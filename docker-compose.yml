# docker-compose.yml: combined deployment of agent + OctoBus
#
# This file orchestrates:
#   1. OctoBus gateway (binds 127.0.0.1:9000 - NOT exposed to public)
#      - portscan / assetquery services run INSIDE OctoBus as on-demand
#        runtime instances (no separate backend containers needed)
#   2. exposure-inspection-agent (managed by agent-compose guest)
#
# Security design:
#   - All services bind 127.0.0.1 or Docker internal network only
#   - No ports published to host's public interface
#   - SSH is the ONLY public access (managed by security group)
#   - restart:always ensures auto-recovery after reboot
#
# Prerequisites:
#   - Docker + docker compose installed
#   - .env file configured (copy from .env.example)
#   - Service packages imported into OctoBus (see octobus-service/README.md)
#
# Service package import (one-time, after first start):
#   docker exec octobus octobus service import portscan /services/portscan --source-mode remote
#   docker exec octobus octobus service import assetquery /services/assetquery --source-mode remote
#   docker exec octobus octobus instance create portscan-default --service portscan \
#     --config-json '{"default_timeout":5,"max_concurrent":10}' --secret-json '{}'
#   docker exec octobus octobus instance create assetquery-default --service assetquery \
#     --config-json '{"asset_data_path":""}' --secret-json '{}'
#   docker exec octobus octobus capset create exposure-scan
#   docker exec octobus octobus capset add-instance exposure-scan portscan-default
#   docker exec octobus octobus capset add-instance exposure-scan assetquery-default
#   docker exec octobus octobus capset add-token exposure-scan

services:
  # ============================================================
  # OctoBus Gateway
  # Binds 127.0.0.1:9000 only - never exposed to public internet
  # Admin API + gRPC + Connect RPC + MCP + Reflection on single port
  # Service instances (portscan/assetquery) run as on-demand
  # child processes managed by OctoBus runtime
  # ============================================================
  octobus:
    image: ghcr.io/chaitin/octobus:latest
    container_name: octobus
    restart: always
    environment:
      - OCTOBUS_LOG_LEVEL=info
    ports:
      # Bind to 127.0.0.1 ONLY - not accessible from public internet
      # agent container connects via Docker internal network
      - "127.0.0.1:9000:9000"
    volumes:
      - octobus_data:/var/lib/octobus
      # Service packages (correct OctoBus format, see octobus-service/README.md)
      - ./octobus-service/portscan:/services/portscan:ro
      - ./octobus-service/assetquery:/services/assetquery:ro
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================================
  # Exposure Inspection Agent (managed by agent-compose)
  # This container runs the agent cycle triggered by agent-compose daemon
  # The agent calls OctoBus via Docker internal network (Connect RPC)
  # ============================================================
  exposure-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exposure-inspection-agent
    restart: always
    environment:
      - OCTOBUS_ENDPOINT=http://octobus:9000
      - OCTOBUS_CAPSET_TOKEN=${OCTOBUS_CAPSET_TOKEN}
      - LLM_API_BASE=${LLM_API_BASE}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - OUTPUT_DIR=/data/output
      - KNOWLEDGE_DIR=/app/knowledge
    volumes:
      - agent_output:/data/output
    networks:
      - agent-net
    depends_on:
      octobus:
        condition: service_healthy

volumes:
  octobus_data:
  agent_output:

networks:
  # Shared bridge network - agent reaches OctoBus by service name
  # No ports from this network are published to the public internet
  agent-net:
    driver: bridge
