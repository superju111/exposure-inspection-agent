# agent-compose project: exposure-inspection-agent
#
# Managed by the agent-compose daemon (v2607.10.0). Schema reference:
# docs/pages/agent-compose-yaml-manual.md @ tag v2607.10.0 (chaitin/agent-compose)
#
# Architecture:
#   daemon  : agent-compose container (docker.sock mounted, 127.0.0.1:7410)
#   sandbox : chaitin/agent-compose-guest image, created per run via docker driver
#   gateway : OctoBus (capset "exposure-scan", Connect RPC over HTTP)
#
# The inspection cycle itself is deterministic Python (src/main.py);
# the scheduler trigger drives an agent turn that executes the cycle.
# Operational/manual execution: `agent-compose run inspector --command "python3 src/main.py"`

name: exposure-inspection-agent

# Deployment secrets (resolved beside the compose file at /data/work/.env).
# OCTOBUS_CAPSET_TOKEN is the capset token issued by OctoBus admin
# (octobus capset add-token exposure-scan inspector-agent).
env_file: .env

workspaces:
  # Local provider: the daemon snapshots ./inspector into each sandbox run.
  # The source directory is never mutated by sandbox runs (immutable,
  # audit-friendly executions).
  inspector:
    provider: local
    path: ./inspector

volumes:
  # Persistent output across sandbox runs (reports + NDJSON audit trail).
  inspection-output: {}

agents:
  inspector:
    image: ghcr.nju.edu.cn/chaitin/agent-compose-guest:latest
    driver:
      docker: {}
    # Select the project workspace (snapshot of ./inspector) at /workspace
    workspace:
      name: inspector
    # Capability authorization boundary: capset "exposure-scan" grants ONLY
    # portscan.v1.PortScanService/ScanPorts and
    # assetquery.v1.AssetQueryService/QueryAssets (method-level whitelist).
    # The agent reaches the OctoBus gateway over the shared docker network
    # using a scoped capset token injected via env (see .env).
    capset_ids:
      - exposure-scan
    volumes:
      # Persistent output volume: reports + NDJSON audit trail survive sandbox
      # removal. Target kept OUTSIDE /workspace (daemon runtime path).
      - inspection-output:/output
    env:
      # OctoBus gateway (Connect RPC), resolved via docker network DNS.
      OCTOBUS_ENDPOINT: http://octobus:9000
      OCTOBUS_CAPSET: exposure-scan
      OCTOBUS_CAPSET_TOKEN:
        value: ${OCTOBUS_CAPSET_TOKEN}
        secret: true
      # Path layout inside the sandbox (workspace snapshot root = /workspace;
      # persistent output lives on the inspection-output volume at /output)
      ASSET_INVENTORY_PATH: /workspace/sample-data/assets.json
      OUTPUT_DIR: /output
      OCTOBUS_TIMEOUT: "90"
      KNOWLEDGE_DIR: /workspace/knowledge
      # 2s per port keeps full-list scans of unreachable hosts inside the
      # OctoBus on-demand invoke deadline (~30s server-side)
      SCAN_TIMEOUT: "2"
      SCAN_CONCURRENCY: "8"
    scheduler:
      enabled: true
      sandbox_policy: new
      triggers:
        # Daily full-scan at 02:00 Asia/Shanghai. Daemon v2607.10.0 evaluates
        # declarative cron triggers in UTC, so 02:00 CST == 18:00 UTC.
        # Cron chosen over event-driven triggers: exposure inspection is a
        # periodic baseline activity; event triggers would cause redundant
        # scans and miss cumulative exposure patterns (port combinations).
        - name: daily-exposure-inspection
          cron: "0 18 * * *"
          prompt: >
            Run the daily internet exposure inspection cycle now. Execute
            `python3 src/main.py` in the project root, then summarize the
            generated report: total assets scanned, findings by severity,
            and the top critical exposures.
