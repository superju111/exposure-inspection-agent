syntax = "proto3";

package portscan;

// Port scanning service - provides TCP port scanning capabilities
// to agents via OctoBus gateway. Agents must call this through OctoBus,
// never directly. This ensures audit logging and credential management.
service PortScanService {
  // Scan specified ports on a target host
  // Returns open/closed state and service banner for each port
  rpc ScanPorts(ScanRequest) returns (ScanResponse) {}
}

message ScanRequest {
  string host = 1;              // Target host (IP or hostname)
  repeated int32 ports = 2;     // Ports to scan
  int32 timeout_per_port = 3;   // Connection timeout per port (seconds)
}

message PortResult {
  int32 port = 1;               // Port number
  string state = 2;             // "open", "closed", "filtered"
  string banner = 3;            // Service banner (if available)
  string service = 4;           // Detected service name
}

message ScanResponse {
  string host = 1;              // Scanned host
  repeated PortResult results = 2;  // Per-port results
  int32 total_scanned = 3;     // Total ports scanned
  int32 total_open = 4;        // Total open ports found
  int64 scan_duration_ms = 5;  // Scan duration in milliseconds
}
